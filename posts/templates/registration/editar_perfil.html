{% extends "posts/base.html" %}

{% block title %}Editar perfil | Blog de Patrick Jane{% endblock %}

{% block content %}
<section class="form-panel">
    <h1>Editar perfil</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="actions">
            <button class="button" type="submit">Guardar cambios</button>
            <a class="button button-secondary" href="{% url 'perfil' %}">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
